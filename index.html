<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeafScan</title>

  <!-- Favicon: SVG inline -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231e4d2b'/><text y='48' x='8' font-size='44'>🌿</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --moss:   #1e4d2b;
      --moss-2: #2e6b3e;
      --sage:   #c8dfc4;
      --cream:  #f6f4ee;
      --ink:    #0f1a0f;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    .splash {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      animation: fadeIn 0.6s ease both;
    }

    /* Subtle radial glow */
    .splash::before {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(46,107,62,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-wrap {
      width: 72px; height: 72px;
      background: var(--moss);
      border-radius: 20px;
      display: grid; place-items: center;
      font-size: 38px;
      animation: popIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s both;
      box-shadow: 0 8px 32px rgba(30,77,43,0.2);
    }

    .wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      letter-spacing: -0.03em;
      color: var(--ink);
      animation: fadeUp 0.5s ease 0.2s both;
    }
    .wordmark span { color: var(--moss-2); }

    .tagline {
      font-size: 0.9rem;
      font-weight: 300;
      color: #516351;
      letter-spacing: 0.01em;
      animation: fadeUp 0.5s ease 0.3s both;
    }

    /* Progress bar */
    .progress-track {
      width: 120px; height: 3px;
      background: var(--sage);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 1rem;
      animation: fadeUp 0.5s ease 0.4s both;
    }
    .progress-fill {
      height: 100%;
      background: var(--moss-2);
      border-radius: 99px;
      width: 0%;
      animation: progress 2s cubic-bezier(0.4,0,0.6,1) 0.5s forwards;
    }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn   { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes progress { from { width: 0%; } to { width: 100%; } }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.97); } }

    .splash.leaving {
      animation: fadeOut 0.4s ease forwards;
    }
  </style>
</head>
<body>

<div class="splash" id="splash">
  <div class="logo-wrap">🌿</div>
  <div class="wordmark">Leaf<span>Scan</span></div>
  <div class="tagline">Onion disease detection, instantly.</div>
  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
</div>

<script>
  setTimeout(() => {
    document.getElementById('splash').classList.add('leaving');
    setTimeout(() => {
      window.location.href = 'frontend/leafscan_frontend.html';
    }, 400);
  }, 2500);
</script>

</body>
</html>
