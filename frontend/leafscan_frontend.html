<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeafScan — Onion Disease Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #1a8c5e;
      --green-dark:  #116644;
      --green-light: #d4f0e3;
      --green-glow:  rgba(26,140,94,0.15);
      --amber:       #e08c2a;
      --amber-light: #fdf3e0;
      --red:         #c0392b;
      --red-light:   #fdecea;
      --bg:          #f5f7f4;
      --surface:     #ffffff;
      --border:      #e2e8e0;
      --text:        #1c2b21;
      --muted:       #6b8070;
      --subtle:      #a8bfb0;
      --radius:      16px;
      --radius-sm:   10px;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
    }

    /* Decorative background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(26,140,94,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 10% 90%, rgba(26,140,94,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 4rem;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.6s ease both;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      border-radius: 18px;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(26,140,94,0.3), 0 2px 4px rgba(0,0,0,0.08);
    }
    .logo-mark i { font-size: 28px; color: #fff; }

    .logo-name {
      font-family: 'DM Serif Display', serif;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .logo-name em { color: var(--green); font-style: normal; }

    .tagline {
      font-size: 0.875rem;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
      padding: 2rem;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    /* ── API row ── */
    .api-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.75rem;
      padding: 0.6rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .api-row i { font-size: 16px; color: var(--subtle); flex-shrink: 0; }
    .api-row input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.8125rem;
      font-family: 'DM Sans', monospace;
      color: var(--muted);
      outline: none;
    }
    .api-row input::placeholder { color: var(--subtle); }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .upload-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 50%, var(--green-glow), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--green);
      background: #f0faf5;
    }
    .upload-zone:hover::before, .upload-zone.drag-over::before { opacity: 1; }

    .upload-icon {
      width: 64px; height: 64px;
      background: var(--green-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      transition: transform 0.2s;
    }
    .upload-zone:hover .upload-icon { transform: scale(1.08); }
    .upload-icon i { font-size: 30px; color: var(--green); }

    .upload-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .upload-sub {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 1.25rem 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }
    .divider span {
      font-size: 0.75rem; color: var(--subtle);
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em;
    }

    /* ── Camera button ── */
    .btn-cam {
      width: 100%;
      padding: 0.75rem 1.25rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-cam:hover {
      border-color: var(--green);
      color: var(--green);
      background: #f0faf5;
    }
    .btn-cam i { font-size: 18px; }

    /* ── Preview ── */
    .preview-section { display: none; }

    .preview-wrap {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0d0d0d;
    }
    .preview-wrap img,
    .preview-wrap video {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      display: block;
    }

    .btn-clear {
      position: absolute; top: 10px; right: 10px;
      width: 32px; height: 32px;
      background: rgba(0,0,0,0.6);
      border: none; border-radius: 50%;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px;
      backdrop-filter: blur(4px);
      transition: background 0.15s;
    }
    .btn-clear:hover { background: rgba(0,0,0,0.85); }

    .cam-controls {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .btn-snap {
      flex: 1; padding: 0.75rem;
      background: var(--green);
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-size: 0.9rem; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-snap:hover { background: var(--green-dark); }
    .btn-snap:active { transform: scale(0.98); }

    .btn-cancel {
      padding: 0.75rem 1.125rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem; font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: var(--bg); }

    /* ── Analyze button ── */
    .btn-analyze {
      width: 100%; margin-top: 1rem;
      padding: 0.875rem;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-size: 0.9375rem; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26,140,94,0.35);
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .btn-analyze:hover { opacity: 0.92; box-shadow: 0 6px 20px rgba(26,140,94,0.4); }
    .btn-analyze:active { transform: scale(0.99); }
    .btn-analyze:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    /* ── Loading ── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
      gap: 1rem;
    }
    .spinner-wrap {
      position: relative;
      width: 52px; height: 52px;
    }
    .spinner-ring {
      width: 52px; height: 52px;
      border: 3px solid var(--green-light);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .spinner-dot {
      position: absolute;
      top: 50%; left: 50%;
      width: 10px; height: 10px;
      background: var(--green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 0.5; transform: translate(-50%,-50%) scale(0.7); } }

    .loading-text { font-size: 0.9rem; color: var(--muted); font-weight: 500; }
    .loading-sub { font-size: 0.78rem; color: var(--subtle); }

    /* ── Error ── */
    .error-box {
      display: none;
      align-items: flex-start;
      gap: 12px;
      margin-top: 1rem;
      padding: 1rem 1.125rem;
      background: var(--red-light);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: var(--radius-sm);
      color: var(--red);
      font-size: 0.875rem;
      animation: fadeUp 0.3s ease;
    }
    .error-box i { font-size: 20px; flex-shrink: 0; margin-top: 1px; }

    /* ── Result card ── */
    .result-card {
      display: none;
      margin-top: 1.25rem;
      animation: fadeUp 0.4s ease;
    }

    .result-top {
      background: linear-gradient(135deg, var(--green), #0e7a50);
      border-radius: var(--radius);
      padding: 1.5rem;
      color: #fff;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
    }
    .result-top::after {
      content: '';
      position: absolute;
      right: -20px; top: -20px;
      width: 140px; height: 140px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }

    .result-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.7;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    .result-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .conf-pill {
      flex-shrink: 0;
      padding: 0.35rem 0.8rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(255,255,255,0.2);
      color: #fff;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
    .conf-pill.low { background: rgba(224,140,42,0.9); }
    .conf-pill.vlow { background: rgba(192,57,43,0.9); }

    /* bars */
    .scores-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.125rem;
    }
    .scores-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--subtle);
      font-weight: 600;
      margin-bottom: 0.875rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.625rem;
    }
    .bar-row:last-child { margin-bottom: 0; }

    .bar-label {
      font-size: 0.8rem;
      color: var(--muted);
      width: 190px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-label.top { color: var(--green); font-weight: 600; }

    .bar-track {
      flex: 1;
      height: 7px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--green), #27c07a);
      transition: width 0.7s cubic-bezier(0.22,1,0.36,1);
    }
    .bar-fill.dim { background: var(--border); }

    .bar-pct {
      font-size: 0.78rem;
      color: var(--muted);
      width: 40px;
      text-align: right;
      font-weight: 500;
    }
    .bar-pct.top { color: var(--green); }

    /* retry */
    .btn-retry {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.875rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: all 0.15s;
    }
    .btn-retry:hover { border-color: var(--green); color: var(--green); background: #f0faf5; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* hidden input */
    input[type=file] { display: none; }
    canvas { display: none; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 1.5rem 1.125rem; }
      .upload-zone { padding: 2.5rem 1rem; }
      .bar-label { width: 130px; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="logo-mark"><i class="ti ti-leaf"></i></div>
    <h1 class="logo-name">Leaf<em>Scan</em></h1>
    <p class="tagline">Onion plant disease detection powered by ML</p>
  </div>

  <div class="card">

    <!-- Backend URL -->
    <div class="api-row">
      <i class="ti ti-server"></i>
      <input type="text" id="api-url" placeholder="https://papabing84-leafscan.hf.space" value="https://papabing84-leafscan.hf.space" />
    </div>

    <!-- Upload area -->
    <div id="upload-area">
      <div class="upload-zone" id="drop-zone">
        <div class="upload-icon"><i class="ti ti-cloud-upload"></i></div>
        <p class="upload-title">Drop a leaf photo here</p>
        <p class="upload-sub">or click to browse your files</p>
      </div>
      <div class="divider"><span>or</span></div>
      <button class="btn-cam" id="btn-open-cam">
        <i class="ti ti-camera"></i> Use camera
      </button>
    </div>

    <!-- Preview -->
    <div class="preview-section" id="preview-section">
      <div class="preview-wrap" id="preview-wrap">
        <img id="preview-img" src="" alt="Leaf preview" style="display:none" />
        <video id="cam-video" autoplay playsinline style="display:none"></video>
        <button class="btn-clear" id="btn-clear" aria-label="Remove" style="display:none">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="cam-controls" id="cam-controls" style="display:none">
        <button class="btn-snap" id="btn-snap"><i class="ti ti-camera"></i> Capture photo</button>
        <button class="btn-cancel" id="btn-cancel-cam">Cancel</button>
      </div>

      <button class="btn-analyze" id="btn-analyze" style="display:none">
        <i class="ti ti-microscope"></i> Analyze leaf
      </button>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner-wrap">
        <div class="spinner-ring"></div>
        <div class="spinner-dot"></div>
      </div>
      <div class="loading-text">Analyzing your leaf…</div>
      <div class="loading-sub">This usually takes a few seconds</div>
    </div>

    <!-- Error -->
    <div class="error-box" id="error-box" role="alert">
      <i class="ti ti-alert-circle"></i>
      <span id="error-msg">Could not connect to backend. Make sure your server is running.</span>
    </div>

    <!-- Result -->
    <div class="result-card" id="result-card">
      <div class="result-top">
        <div>
          <div class="result-label">Detected condition</div>
          <div class="result-name" id="result-name">—</div>
        </div>
        <div class="conf-pill" id="conf-badge">—</div>
      </div>
      <div class="scores-section">
        <div class="scores-title">All class scores</div>
        <div id="bars-container"></div>
      </div>
      <button class="btn-retry" id="btn-retry">
        <i class="ti ti-refresh"></i> Analyze another photo
      </button>
    </div>

  </div><!-- /card -->
</div><!-- /page -->

<input type="file" id="file-input" accept="image/*" />
<canvas id="snap-canvas"></canvas>

<script>
const dropZone    = document.getElementById('drop-zone');
const fileInput   = document.getElementById('file-input');
const uploadArea  = document.getElementById('upload-area');
const previewSec  = document.getElementById('preview-section');
const previewImg  = document.getElementById('preview-img');
const camVideo    = document.getElementById('cam-video');
const btnClear    = document.getElementById('btn-clear');
const btnAnalyze  = document.getElementById('btn-analyze');
const btnOpenCam  = document.getElementById('btn-open-cam');
const btnSnap     = document.getElementById('btn-snap');
const btnCancelCam= document.getElementById('btn-cancel-cam');
const camControls = document.getElementById('cam-controls');
const loading     = document.getElementById('loading');
const resultCard  = document.getElementById('result-card');
const errorBox    = document.getElementById('error-box');
const errorMsg    = document.getElementById('error-msg');
const snapCanvas  = document.getElementById('snap-canvas');
const apiUrlInput = document.getElementById('api-url');

let currentFile = null, stream = null;

function showPreview() {
  uploadArea.style.display = 'none';
  previewSec.style.display = 'block';
  resultCard.style.display = 'none';
  errorBox.style.display = 'none';
}

function resetAll() {
  uploadArea.style.display = 'block';
  previewSec.style.display = 'none';
  previewImg.style.display = 'none';
  previewImg.src = '';
  camVideo.style.display = 'none';
  btnClear.style.display = 'none';
  btnAnalyze.style.display = 'none';
  camControls.style.display = 'none';
  loading.style.display = 'none';
  resultCard.style.display = 'none';
  errorBox.style.display = 'none';
  currentFile = null;
  stopCam();
}

function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  currentFile = file;
  previewImg.src = URL.createObjectURL(file);
  previewImg.style.display = 'block';
  camVideo.style.display = 'none';
  btnClear.style.display = 'flex';
  btnAnalyze.style.display = 'flex';
  camControls.style.display = 'none';
  showPreview();
}

btnOpenCam.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    camVideo.srcObject = stream;
    previewImg.style.display = 'none';
    camVideo.style.display = 'block';
    btnClear.style.display = 'none';
    btnAnalyze.style.display = 'none';
    camControls.style.display = 'flex';
    showPreview();
  } catch {
    showError('Camera access denied or unavailable on this device.');
  }
});

btnSnap.addEventListener('click', () => {
  snapCanvas.width  = camVideo.videoWidth;
  snapCanvas.height = camVideo.videoHeight;
  snapCanvas.getContext('2d').drawImage(camVideo, 0, 0);
  stopCam();
  snapCanvas.toBlob(blob => {
    currentFile = new File([blob], 'capture.jpg', { type: 'image/jpeg' });
    previewImg.src = URL.createObjectURL(blob);
    previewImg.style.display = 'block';
    camVideo.style.display = 'none';
    btnClear.style.display = 'flex';
    btnAnalyze.style.display = 'flex';
    camControls.style.display = 'none';
  }, 'image/jpeg', 0.92);
});

btnCancelCam.addEventListener('click', resetAll);
btnClear.addEventListener('click', resetAll);
document.getElementById('btn-retry').addEventListener('click', resetAll);

function showError(msg) {
  loading.style.display = 'none';
  errorMsg.textContent = msg;
  errorBox.style.display = 'flex';
}

btnAnalyze.addEventListener('click', async () => {
  if (!currentFile) return;
  const apiUrl = (apiUrlInput.value || 'http://localhost:8000').replace(/\/$/, '');
  btnAnalyze.style.display = 'none';
  loading.style.display = 'flex';
  resultCard.style.display = 'none';
  errorBox.style.display = 'none';

  const fd = new FormData();
  fd.append('file', currentFile);

  try {
    const res = await fetch(`${apiUrl}/predict`, { method: 'POST', body: fd });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    showResult(await res.json());
  } catch {
    showError(`Could not connect to backend at ${apiUrl}. Make sure your FastAPI server is running.`);
    btnAnalyze.style.display = 'flex';
  } finally {
    loading.style.display = 'none';
  }
});

function showResult(data) {
  const conf = data.confidence;
  document.getElementById('result-name').textContent = data.disease;

  const badge = document.getElementById('conf-badge');
  badge.textContent = conf.toFixed(1) + '% confidence';
  badge.className = 'conf-pill' + (conf < 50 ? ' vlow' : conf < 75 ? ' low' : '');

  const container = document.getElementById('bars-container');
  container.innerHTML = '';
  const scores = data.all_scores || {};
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]).slice(0,8);

  sorted.forEach(([name, pct]) => {
    const isTop = name === data.disease;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label${isTop?' top':''}" title="${name}">${name}</div>
      <div class="bar-track"><div class="bar-fill${isTop?'':' dim'}" style="width:${Math.max(pct,0.5).toFixed(1)}%"></div></div>
      <div class="bar-pct${isTop?' top':''}">${pct.toFixed(1)}%</div>`;
    container.appendChild(row);
  });

  resultCard.style.display = 'block';
}
</script>
</body>
</html>
