
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }

  .app { max-width: 680px; margin: 0 auto; padding: 2rem 1rem; }

  .header { text-align: center; margin-bottom: 2rem; }
  .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
  .logo-icon { width: 40px; height: 40px; background: #1D9E75; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .logo-icon i { font-size: 22px; color: #fff; }
  .logo-text { font-size: 26px; font-weight: 500; color: var(--color-text-primary); }
  .logo-text span { color: #1D9E75; }
  .tagline { font-size: 14px; color: var(--color-text-secondary); }

  .upload-zone { border: 1.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-lg); padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: var(--color-background-primary); }
  .upload-zone:hover, .upload-zone.drag-over { border-color: #1D9E75; background: #E1F5EE; }
  .upload-zone i { font-size: 40px; color: #1D9E75; margin-bottom: 0.75rem; display: block; }
  .upload-zone p { font-size: 15px; color: var(--color-text-secondary); }
  .upload-zone strong { color: var(--color-text-primary); }

  .or-row { display: flex; align-items: center; gap: 12px; margin: 1.25rem 0; }
  .or-row::before, .or-row::after { content: ''; flex: 1; height: 0.5px; background: var(--color-border-tertiary); }
  .or-row span { font-size: 13px; color: var(--color-text-tertiary); }

  .btn-cam { width: 100%; padding: 10px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
  .btn-cam:hover { background: var(--color-background-tertiary); }

  .preview-section { display: none; }
  .preview-wrap { position: relative; border-radius: var(--border-radius-lg); overflow: hidden; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); }
  .preview-wrap img { width: 100%; max-height: 280px; object-fit: contain; display: block; }
  .preview-wrap video { width: 100%; max-height: 280px; object-fit: cover; display: block; }
  .btn-clear { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); border: none; color: #fff; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

  .cam-controls { display: flex; gap: 8px; margin-top: 10px; }
  .btn-snap { flex: 1; padding: 10px; font-size: 14px; background: #1D9E75; color: #fff; border: none; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; }
  .btn-snap:hover { background: #0F6E56; }
  .btn-cancel-cam { padding: 10px 16px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; }

  .btn-analyze { width: 100%; margin-top: 1rem; padding: 12px; font-size: 15px; font-weight: 500; background: #1D9E75; color: #fff; border: none; border-radius: var(--border-radius-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
  .btn-analyze:hover { background: #0F6E56; }
  .btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading { display: none; text-align: center; padding: 2rem; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--color-border-tertiary); border-top-color: #1D9E75; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-size: 14px; color: var(--color-text-secondary); }

  .result-card { display: none; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-top: 1.25rem; }
  .result-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; }
  .result-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-tertiary); margin-bottom: 4px; }
  .result-name { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .conf-badge { background: #E1F5EE; color: #0F6E56; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: var(--border-radius-md); white-space: nowrap; }
  .conf-badge.low { background: #FAEEDA; color: #854F0B; }
  .conf-badge.vlow { background: #FCEBEB; color: #A32D2D; }

  .bars-title { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 10px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bar-label { font-size: 12px; color: var(--color-text-secondary); width: 180px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 6px; background: var(--color-background-tertiary); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: #1D9E75; border-radius: 3px; transition: width 0.6s ease; }
  .bar-fill.dim { background: var(--color-border-secondary); }
  .bar-pct { font-size: 12px; color: var(--color-text-secondary); width: 38px; text-align: right; }

  .btn-retry { width: 100%; margin-top: 1rem; padding: 10px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-retry:hover { background: var(--color-background-secondary); }

  .error-box { display: none; background: #FCEBEB; border: 0.5px solid #F09595; border-radius: var(--border-radius-md); padding: 1rem 1.25rem; margin-top: 1rem; color: #A32D2D; font-size: 14px; display: none; align-items: center; gap: 10px; }
  .error-box i { font-size: 18px; flex-shrink: 0; }

  input[type=file] { display: none; }

  .api-row { display: flex; gap: 8px; margin-bottom: 1.25rem; align-items: center; }
  .api-row input { flex: 1; padding: 8px 12px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
  .api-label { font-size: 12px; color: var(--color-text-tertiary); flex-shrink: 0; }
</style>

<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><i class="ti ti-leaf" aria-hidden="true"></i></div>
      <div class="logo-text">Leaf<span>Scan</span></div>
    </div>
    <p class="tagline">Onion plant disease detection powered by AI</p>
  </div>

  <div class="api-row">
    <span class="api-label">Backend URL</span>
    <input type="text" id="api-url" placeholder="http://127.0.0.1:8000" value="http://127.0.0.1:8000" />
  </div>

  <div id="upload-area">
    <div class="upload-zone" id="drop-zone">
      <i class="ti ti-cloud-upload" aria-hidden="true"></i>
      <p><strong>Drop a leaf photo here</strong><br>or click to browse</p>
    </div>
    <div class="or-row"><span>or</span></div>
    <button class="btn-cam" id="btn-open-cam">
      <i class="ti ti-camera" aria-hidden="true"></i> Use camera
    </button>
  </div>

  <div class="preview-section" id="preview-section">
    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" src="" alt="Selected leaf" style="display:none" />
      <video id="cam-video" autoplay playsinline style="display:none"></video>
      <button class="btn-clear" id="btn-clear" aria-label="Remove image" style="display:none">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="cam-controls" id="cam-controls" style="display:none">
      <button class="btn-snap" id="btn-snap"><i class="ti ti-camera" aria-hidden="true"></i> Capture</button>
      <button class="btn-cancel-cam" id="btn-cancel-cam">Cancel</button>
    </div>
    <button class="btn-analyze" id="btn-analyze" style="display:none">
      <i class="ti ti-search" aria-hidden="true"></i> Analyze leaf
    </button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Analyzing your leaf image...</p>
  </div>

  <div class="error-box" id="error-box" role="alert">
    <i class="ti ti-alert-circle" aria-hidden="true"></i>
    <span id="error-msg">Could not connect to backend. Make sure your server is running.</span>
  </div>

  <div class="result-card" id="result-card">
    <div class="result-header">
      <div>
        <div class="result-label">Detected condition</div>
        <div class="result-name" id="result-name">—</div>
      </div>
      <div class="conf-badge" id="conf-badge">—</div>
    </div>
    <div class="bars-title">All class scores</div>
    <div id="bars-container"></div>
    <button class="btn-retry" id="btn-retry">
      <i class="ti ti-refresh" aria-hidden="true"></i> Analyze another
    </button>
  </div>

  <input type="file" id="file-input" accept="image/*" />
  <canvas id="snap-canvas" style="display:none"></canvas>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const uploadArea = document.getElementById('upload-area');
const previewSection = document.getElementById('preview-section');
const previewImg = document.getElementById('preview-img');
const camVideo = document.getElementById('cam-video');
const btnClear = document.getElementById('btn-clear');
const btnAnalyze = document.getElementById('btn-analyze');
const btnOpenCam = document.getElementById('btn-open-cam');
const btnSnap = document.getElementById('btn-snap');
const btnCancelCam = document.getElementById('btn-cancel-cam');
const camControls = document.getElementById('cam-controls');
const loading = document.getElementById('loading');
const resultCard = document.getElementById('result-card');
const errorBox = document.getElementById('error-box');
const errorMsg = document.getElementById('error-msg');
const snapCanvas = document.getElementById('snap-canvas');
const apiUrlInput = document.getElementById('api-url');

let currentFile = null;
let stream = null;

function showPreview() {
  uploadArea.style.display = 'none';
  previewSection.style.display = 'block';
  resultCard.style.display = 'none';
  errorBox.style.display = 'none';
}

function resetAll() {
  uploadArea.style.display = 'block';
  previewSection.style.display = 'none';
  previewImg.style.display = 'none';
  previewImg.src = '';
  camVideo.style.display = 'none';
  btnClear.style.display = 'none';
  btnAnalyze.style.display = 'none';
  camControls.style.display = 'none';
  loading.style.display = 'none';
  resultCard.style.display = 'none';
  errorBox.style.display = 'none';
  currentFile = null;
  stopCam();
}

function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadFile(file);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) loadFile(fileInput.files[0]);
});

function loadFile(file) {
  currentFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  previewImg.style.display = 'block';
  camVideo.style.display = 'none';
  btnClear.style.display = 'flex';
  btnAnalyze.style.display = 'flex';
  camControls.style.display = 'none';
  showPreview();
}

btnOpenCam.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    camVideo.srcObject = stream;
    previewImg.style.display = 'none';
    camVideo.style.display = 'block';
    btnClear.style.display = 'none';
    btnAnalyze.style.display = 'none';
    camControls.style.display = 'flex';
    showPreview();
  } catch(e) {
    showError('Camera access denied or not available.');
  }
});

btnSnap.addEventListener('click', () => {
  snapCanvas.width = camVideo.videoWidth;
  snapCanvas.height = camVideo.videoHeight;
  snapCanvas.getContext('2d').drawImage(camVideo, 0, 0);
  stopCam();
  snapCanvas.toBlob(blob => {
    currentFile = new File([blob], 'capture.jpg', { type: 'image/jpeg' });
    const url = URL.createObjectURL(blob);
    previewImg.src = url;
    previewImg.style.display = 'block';
    camVideo.style.display = 'none';
    btnClear.style.display = 'flex';
    btnAnalyze.style.display = 'flex';
    camControls.style.display = 'none';
  }, 'image/jpeg', 0.92);
});

btnCancelCam.addEventListener('click', resetAll);
btnClear.addEventListener('click', resetAll);
document.getElementById('btn-retry').addEventListener('click', resetAll);

function showError(msg) {
  loading.style.display = 'none';
  errorMsg.textContent = msg;
  errorBox.style.display = 'flex';
}

btnAnalyze.addEventListener('click', async () => {
  if (!currentFile) return;
  const apiUrl = (apiUrlInput.value || 'http://localhost:8000').replace(/\/$/, '');

  btnAnalyze.style.display = 'none';
  loading.style.display = 'block';
  resultCard.style.display = 'none';
  errorBox.style.display = 'none';

  const formData = new FormData();
  formData.append('file', currentFile);

  try {
    const res = await fetch(`${apiUrl}/predict`, { method: 'POST', body: formData });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    showResult(data);
  } catch(e) {
    showError(`Could not connect to backend at ${apiUrl}. Make sure your FastAPI server is running.`);
    btnAnalyze.style.display = 'flex';
  } finally {
    loading.style.display = 'none';
  }
});

function showResult(data) {
  const conf = data.confidence;
  document.getElementById('result-name').textContent = data.disease;
  const badge = document.getElementById('conf-badge');
  badge.textContent = conf.toFixed(1) + '% confidence';
  badge.className = 'conf-badge' + (conf < 50 ? ' vlow' : conf < 75 ? ' low' : '');

  const container = document.getElementById('bars-container');
  container.innerHTML = '';
  const scores = data.all_scores || {};
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top = sorted.slice(0, 8);

  top.forEach(([name, pct]) => {
    const isTop = name === data.disease;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label" title="${name}">${name}</div>
      <div class="bar-track"><div class="bar-fill${isTop ? '' : ' dim'}" style="width:${Math.max(pct, 0.5).toFixed(1)}%"></div></div>
      <div class="bar-pct">${pct.toFixed(1)}%</div>
    `;
    container.appendChild(row);
  });

  resultCard.style.display = 'block';
}
</script>
